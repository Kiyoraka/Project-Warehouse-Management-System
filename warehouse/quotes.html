<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotes · Warehouse · Sheepy Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/styles.css" />
  <link rel="stylesheet" href="../shared/glass.css" />
  <style>
    .quote-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 20px;
    }
    .quote-list { padding: 24px; max-height: calc(100vh - 240px); overflow-y: auto; }
    .quote-card {
      padding: 16px;
      background: var(--white-soft);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .quote-card:hover { border-color: var(--gray-300); }
    .quote-card.selected { border-color: var(--red); background: rgba(254, 226, 226, 0.3); }
    .quote-card .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .quote-card .code { font-family: monospace; font-weight: 700; font-size: 0.88rem; }
    .quote-card .ws { font-weight: 600; margin-bottom: 4px; }
    .quote-card .desc { font-size: 0.85rem; color: var(--gray-700); }
    .quote-card .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--gray-100); font-size: 0.78rem; color: var(--text-muted); }

    .quote-detail { padding: 28px; }
    .quote-detail .section { margin-bottom: 20px; }
    .quote-detail .section h4 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .req-item {
      padding: 14px;
      background: var(--white-soft);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
    }
    .req-item .desc { font-weight: 600; }
    .req-item .qty { font-size: 0.88rem; color: var(--red-deep); margin-top: 4px; font-weight: 700; }

    @media (max-width: 1024px) { .quote-grid { grid-template-columns: 1fr; } .quote-list { max-height: 400px; } }
  </style>
</head>
<body class="app-shell">
  <div data-slot="sidebar"></div>
  <div data-slot="topbar"></div>

  <main class="app-content">

    <div class="page-header">
      <div>
        <h1>Custom Quote Inbox</h1>
        <div class="subtitle">Single-shot quotes · price the request, send to wholesaler, accept or decline</div>
      </div>
    </div>

    <div class="status-tabs glass-strong" id="statusTabs" style="display: flex; gap: 6px; padding: 6px; margin-bottom: 20px; width: fit-content;">
      <div class="settings-tab active" data-status="pending" onclick="filterQuotes('pending')" style="padding: 8px 16px; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 600; cursor: pointer; color: var(--gray-700); display: flex; align-items: center; gap: 8px;">Pending <span style="background: var(--red-soft); color: var(--red); padding: 1px 8px; border-radius: 999px; font-size: 0.72rem;" id="cntPending">—</span></div>
      <div class="settings-tab" data-status="quoted" onclick="filterQuotes('quoted')" style="padding: 8px 16px; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 600; cursor: pointer; color: var(--gray-700); display: flex; align-items: center; gap: 8px;">Quoted <span style="background: rgba(245,158,11,0.12); color: #b45309; padding: 1px 8px; border-radius: 999px; font-size: 0.72rem;" id="cntQuoted">—</span></div>
      <div class="settings-tab" data-status="accepted" onclick="filterQuotes('accepted')" style="padding: 8px 16px; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 600; cursor: pointer; color: var(--gray-700); display: flex; align-items: center; gap: 8px;">Accepted <span style="background: rgba(16,185,129,0.10); color: #047857; padding: 1px 8px; border-radius: 999px; font-size: 0.72rem;" id="cntAccepted">—</span></div>
      <div class="settings-tab" data-status="declined" onclick="filterQuotes('declined')" style="padding: 8px 16px; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 600; cursor: pointer; color: var(--gray-700); display: flex; align-items: center; gap: 8px;">Declined <span style="background: var(--gray-100); color: var(--gray-500); padding: 1px 8px; border-radius: 999px; font-size: 0.72rem;" id="cntDeclined">—</span></div>
    </div>
    <style>
      .settings-tab.active { background: linear-gradient(135deg, var(--red), var(--red-deep)); color: var(--white) !important; }
      .settings-tab.active span { background: rgba(255,255,255,0.2) !important; color: var(--white) !important; }
    </style>

    <div class="quote-grid">
      <div class="quote-list glass-strong" id="quoteList"></div>
      <div class="quote-detail glass-strong" id="quoteDetail">
        <div class="text-muted text-center" style="padding: 80px 20px;">
          <div style="font-size: 3rem; margin-bottom: 12px;">💬</div>
          Select a quote on the left to view details
        </div>
      </div>
    </div>

  </main>

  <script src="../shared/mock-data.js"></script>
  <script src="../shared/nav.js"></script>
  <script>
    window.SheepyNav.insertNav('warehouse', 'quotes', { showSearch: false });

    const M = window.SheepyMock;
    const wh = 'wh-kl';
    let activeStatus = 'pending';
    let activeQuote = null;

    function updateCounts() {
      const all = M.quotesForWarehouse(wh);
      document.getElementById('cntPending').textContent  = all.filter(q => q.status === 'pending').length;
      document.getElementById('cntQuoted').textContent   = all.filter(q => q.status === 'quoted').length;
      document.getElementById('cntAccepted').textContent = all.filter(q => q.status === 'accepted').length;
      document.getElementById('cntDeclined').textContent = all.filter(q => q.status === 'declined').length;
    }

    function filterQuotes(status) {
      activeStatus = status;
      document.querySelectorAll('.settings-tab').forEach(t => t.classList.toggle('active', t.dataset.status === status));
      const quotes = M.quotesForWarehouse(wh).filter(q => q.status === status);
      if (quotes.length === 0) {
        document.getElementById('quoteList').innerHTML = `<div class="text-muted text-center" style="padding: 60px 20px;">No ${status} quotes</div>`;
        return;
      }
      const html = quotes.map(q => {
        const ws = M.getWholesaler(q.wholesalerId);
        const stCls = q.status === 'pending' ? 'pill-warn' : (q.status === 'accepted' ? 'pill-active' : 'pill-info');
        const itemSummary = q.items[0].description + (q.items.length > 1 ? ` +${q.items.length - 1} more` : '');
        return `<div class="quote-card" onclick="selectQuote('${q.id}')">
          <div class="top">
            <span class="code">${q.code}</span>
            <span class="pill ${stCls}">${q.status}</span>
          </div>
          <div class="ws">${ws.businessName}</div>
          <div class="desc">${itemSummary}</div>
          <div class="footer-row">
            <span>📅 ${q.submittedAt}</span>
            <span>${q.items.length} item(s)</span>
          </div>
        </div>`;
      }).join('');
      document.getElementById('quoteList').innerHTML = html;
    }

    function selectQuote(id) {
      const q = M.state.quotes.find(x => x.id === id);
      if (!q) return;
      activeQuote = q;
      document.querySelectorAll('.quote-card').forEach(c => c.classList.remove('selected'));
      event.currentTarget.classList.add('selected');

      const ws = M.getWholesaler(q.wholesalerId);
      const items = q.items.map(i => `
        <div class="req-item">
          <div class="desc">${i.description}</div>
          <div class="qty">Requested: ${i.requestedQty} ${i.requestedUnit}</div>
        </div>`).join('');

      let actionBlock = '';
      if (q.status === 'pending') {
        actionBlock = `
          <div class="section">
            <h4>Quote Response (Single-Shot)</h4>
            <div class="form-group">
              <label class="form-label">Fulfillment Plan *</label>
              <textarea class="form-textarea" placeholder="e.g. Repack from 5kg + 3kg portions, Batch B-2026-04-28. Vacuum-sealed, ready for delivery May 7." style="min-height: 100px;"></textarea>
              <div class="form-hint">Wholesaler will see this as the proposed plan</div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Quoted Total (RM) *</label>
                <input class="form-input" type="number" step="0.01" placeholder="360.00" />
              </div>
              <div class="form-group">
                <label class="form-label">Valid Until</label>
                <input class="form-input" type="date" value="2026-05-12" />
              </div>
            </div>
            <div class="glass-red glass-card-sm" style="padding: 12px; font-size: 0.85rem;">
              ⚠️ <strong>Single-shot:</strong> Wholesaler can only accept or decline. No counter-offers. Make sure your price is fair-and-final.
            </div>
            <div style="display: flex; gap: 10px; margin-top: 16px;">
              <button class="btn btn-danger-outline btn-block">Decline Request</button>
              <button class="btn btn-primary btn-block">Send Quote →</button>
            </div>
          </div>`;
      } else if (q.response) {
        const r = q.response;
        actionBlock = `
          <div class="section">
            <h4>Your Response</h4>
            <div class="glass-subtle" style="padding: 16px;">
              <div style="margin-bottom:10px;"><strong>Plan:</strong> ${r.fulfillmentDetails}</div>
              <div style="display: flex; gap: 24px; font-size: 0.88rem;">
                <div><span class="text-muted">Total:</span> <strong style="color: var(--red); font-size: 1.05rem;">${M.formatRM(r.quotedTotal)}</strong></div>
                <div><span class="text-muted">Valid until:</span> ${r.validUntil}</div>
                <div><span class="text-muted">Sent by:</span> ${r.respondedBy}</div>
              </div>
            </div>
          </div>`;
      }

      document.getElementById('quoteDetail').innerHTML = `
        <div class="section">
          <div style="display:flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <h2>${q.code}</h2>
              <div class="text-muted fs-sm">From ${ws.businessName} · submitted ${q.submittedAt}</div>
            </div>
            <span class="pill ${q.status === 'pending' ? 'pill-warn' : (q.status === 'accepted' ? 'pill-active' : 'pill-info')}">${q.status}</span>
          </div>
        </div>
        <div class="section">
          <h4>Wholesaler's Request</h4>
          ${items}
          ${q.notes ? `<div class="text-muted fs-sm" style="margin-top: 8px;"><strong>Notes:</strong> ${q.notes}</div>` : ''}
        </div>
        ${actionBlock}
      `;
    }

    window.filterQuotes = filterQuotes;
    window.selectQuote = selectQuote;
    updateCounts();
    filterQuotes('pending');
  </script>
</body>
</html>
